var PAGE=120;
var st={q:'',cats:new Set(),brands:new Set(),sort:'',shown:PAGE,brandAll:false};
function $(id){return document.getElementById(id)}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hi(s){if(!st.q)return esc(s);try{var re=new RegExp('('+reEsc(st.q)+')','ig');return esc(s).replace(re,'<mark>$1</mark>')}catch(e){return esc(s)}}
function cntBy(k){var m={};DATA.forEach(function(d){if(d[k])m[d[k]]=(m[d[k]]||0)+1});return m}
var CM=cntBy('c'),BM=cntBy('b');
function buildCats(){var a=Object.keys(CM).sort(function(x,y){return CM[y]-CM[x]||x.localeCompare(y,'zh')});
$('fcats').innerHTML=a.map(function(c){return '<label class="fitem"><input type="checkbox" data-cat="'+esc(c)+'"'+(st.cats.has(c)?' checked':'')+'><span class="n">'+esc(c)+'</span><span class="c">'+CM[c]+'</span></label>'}).join('');}
function buildBrands(){var a=Object.keys(BM).sort(function(x,y){return BM[y]-BM[x]||x.localeCompare(y,'zh')});
var s=st.brandAll?a:a.slice(0,16);
$('fbrands').innerHTML=s.map(function(b){return '<label class="fitem"><input type="checkbox" data-brand="'+esc(b)+'"'+(st.brands.has(b)?' checked':'')+'><span class="n">'+esc(b)+'</span><span class="c">'+BM[b]+'</span></label>'}).join('');
$('bmore').style.display=st.brandAll?'none':'block';
$('bmore').textContent='展开全部 '+a.length+' 个品牌';}
function match(d){
if(st.cats.size&&!st.cats.has(d.c))return false;
if(st.brands.size&&!st.brands.has(d.b))return false;
if(st.q){var s=(d.n+' '+d.b+' '+d.c+' '+d.t).toLowerCase();if(s.indexOf(st.q)<0)return false}
return true;}
function pick(){
var r=DATA.filter(match);
if(st.sort==='score')r.sort(function(x,y){return (parseFloat(y.s)||0)-(parseFloat(x.s)||0)});
else if(st.sort==='cmt')r.sort(function(x,y){return y.m-x.m});
else if(st.sort==='pic')r.sort(function(x,y){return y.g-x.g});
else if(st.sort==='name')r.sort(function(x,y){return x.n.localeCompare(y.n,'zh')});
return r;}
function card(d){
return '<a class="pcard" href="p/'+d.id+'.html"><div class="ph">'+
(d.i?'<img loading="lazy" src="'+d.i+'" alt="">':'<span class="no">暂无图片</span>')+
'</div><div class="b"><div class="nm">'+hi(d.n)+'</div>'+
(d.b?'<div class="br">'+hi(d.b)+'</div>':'')+
'<div class="mt">'+(d.s?'<span class="pill">'+esc(d.s)+'</span>':'')+
'<span>'+d.m+' 点评</span><span>·</span><span>'+d.g+' 图</span></div></div></a>';}
function drawActive(){
var h='';
if(st.q)h+='<span class="t">搜索：'+esc(st.q)+'<button data-k="q">×</button></span>';
st.cats.forEach(function(c){h+='<span class="t">'+esc(c)+'<button data-k="c" data-v="'+esc(c)+'">×</button></span>'});
st.brands.forEach(function(b){h+='<span class="t">'+esc(b)+'<button data-k="b" data-v="'+esc(b)+'">×</button></span>'});
$('active').innerHTML=h;}
function draw(){
var r=pick();
$('cnt').textContent='共 '+r.length+' 件';
$('list').innerHTML=r.slice(0,st.shown).map(card).join('');
$('none').style.display=r.length?'none':'block';
$('lmwrap').style.display=r.length>st.shown?'block':'none';
$('lm').textContent='加载更多（还有 '+(r.length-st.shown)+' 件）';
drawActive();}
function reset(){st.q='';st.cats.clear();st.brands.clear();st.sort='';$('q').value='';$('fsort').value='';st.shown=PAGE;buildCats();buildBrands();draw();}
var timer;
$('q').addEventListener('input',function(){var v=this.value.trim().toLowerCase();clearTimeout(timer);timer=setTimeout(function(){st.q=v;st.shown=PAGE;draw()},110)});
$('fcats').addEventListener('change',function(e){var c=e.target.dataset.cat;if(!c)return;e.target.checked?st.cats.add(c):st.cats.delete(c);st.shown=PAGE;draw()});
$('fbrands').addEventListener('change',function(e){var b=e.target.dataset.brand;if(!b)return;e.target.checked?st.brands.add(b):st.brands.delete(b);st.shown=PAGE;draw()});
$('active').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var k=b.dataset.k;
if(k==='q'){st.q='';$('q').value=''}else if(k==='c'){st.cats.delete(b.dataset.v);buildCats()}else{st.brands.delete(b.dataset.v);buildBrands()}
st.shown=PAGE;draw();});
$('cc').addEventListener('click',function(){st.cats.clear();buildCats();st.shown=PAGE;draw()});
$('bc').addEventListener('click',function(){st.brands.clear();buildBrands();st.shown=PAGE;draw()});
$('bmore').addEventListener('click',function(){st.brandAll=true;buildBrands()});
$('fsort').addEventListener('change',function(){st.sort=this.value;st.shown=PAGE;draw()});
$('lm').addEventListener('click',function(){st.shown+=PAGE;draw()});
$('clear').addEventListener('click',reset);
document.addEventListener('keydown',function(e){
if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('q').focus()}
if(e.key==='Escape'&&document.activeElement===$('q')){st.q='';$('q').value='';st.shown=PAGE;draw();$('q').blur()}
});
if(window.IntersectionObserver){var io=new IntersectionObserver(function(es){if(es[0].isIntersecting&&$('lmwrap').style.display!=='none'){st.shown+=PAGE;draw()}},{rootMargin:'400px'});io.observe($('lmwrap'))}
var p=new URLSearchParams(location.search);if(p.get('q')){st.q=p.get('q').trim().toLowerCase();$('q').value=p.get('q')}
buildCats();buildBrands();draw();
</script></body></html>
